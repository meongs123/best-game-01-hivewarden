<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIVEWARDEN — your swarm is your weapon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1c08; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { max-width: 100vw; max-height: 100vh; width: auto; height: auto; display: block; touch-action: none; background: #8fc25e; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="HIVEWARDEN: direct your bee swarm through ten days across four meadows to defend the hives from wasps"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
